services:
  app:
    build: .
    image: webhook-relay:1.0.0
    platform: linux/amd64
    container_name: webhook-relay
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - DATABASE_URL=sqlite:////app/data/webhook_1.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped